{% extends "base.html" %}
{% block title %}Login — MarathonLMS{% endblock %}
{% block content %}
<div
    style="max-width:400px;margin:60px auto;background:#1a1d27;padding:32px;border-radius:12px;border:1px solid #2d2f3e;">
    <h1 style="margin-bottom:24px;color:#c7d2fe;font-size:1.5rem;">Sign In to MarathonLMS</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div style="margin-bottom:16px;">
            <label style="display:block;margin-bottom:6px;color:#94a3b8;font-size:.875rem;">{{ field.label }}</label>
            <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                value="{{ field.value|default:'' }}" {% if field.field.required %}required{% endif %}
                style="width:100%;padding:10px 14px;background:#0f1117;border:1px solid #2d2f3e;border-radius:8px;color:#e8e8e8;font-size:1rem;">
            {% for error in field.errors %}
            <span style="color:#f87171;font-size:.8rem;">{{ error }}</span>
            {% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Sign In</button>
    </form>
</div>
{% endblock %}
