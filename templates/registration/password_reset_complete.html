{% extends "base.html" %}
{% block title %}Password Reset Complete — MarathonLMS{% endblock %}
{% block content %}
<div
    style="max-width:400px;margin:60px auto;background:#1a1d27;padding:32px;border-radius:12px;border:1px solid #2d2f3e;text-align:center;">
    <div style="font-size:3rem;margin-bottom:16px;">✅</div>
    <h1 style="margin-bottom:12px;color:#c7d2fe;font-size:1.5rem;">Password changed!</h1>
    <p style="color:#94a3b8;font-size:0.9rem;line-height:1.6;margin-bottom:24px;">
        Your password has been set successfully. You can now log in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="display:inline-block;">Log in now</a>
</div>
{% endblock %}
