{% extends "base.html" %}
{% block title %}Reset Password — MarathonLMS{% endblock %}
{% block content %}
<div
    style="max-width:400px;margin:60px auto;background:#1a1d27;padding:32px;border-radius:12px;border:1px solid #2d2f3e;">
    <h1 style="margin-bottom:8px;color:#c7d2fe;font-size:1.5rem;">Forgot your password?</h1>
    <p style="color:#94a3b8;font-size:0.9rem;margin-bottom:24px;">
        Enter your email address below and we'll send you a link to reset your password.
    </p>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:16px;">
            <label style="display:block;margin-bottom:6px;color:#94a3b8;font-size:.875rem;">Email Address</label>
            <input type="email" name="email" required autocomplete="email"
                style="width:100%;padding:10px 14px;background:#0f1117;border:1px solid #2d2f3e;border-radius:8px;color:#e8e8e8;font-size:1rem;">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Send Reset Link</button>
    </form>

    <div style="margin-top:24px;text-align:center;font-size:0.9rem;">
        <a href="{% url 'login' %}" style="color:#6366f1;text-decoration:none;">← Back to Login</a>
    </div>
</div>
{% endblock %}
